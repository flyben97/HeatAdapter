[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heatadapter"
version = "0.1.0"
description = "Learnable multiscale heat diffusion for molecular graph regression"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "rdkit>=2024.3",
  "torch>=2.5,<3",
  "torch-geometric>=2.5,<3",
]

[project.scripts]
heatadapter-train = "analysis.revision_benchmark:main"
heatadapter-predict = "graphheat.predict:main"

[tool.setuptools.packages.find]
include = ["graphheat*", "analysis*"]

[tool.setuptools.package-data]
graphheat = ["configs/*.json"]

[tool.black]
line-length = 100
target-version = ["py311"]
